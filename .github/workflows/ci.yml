name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install the production release archive
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/demo-studio-release" "$RUNNER_TEMP/demo-studio-production"
          npm pack --pack-destination "$RUNNER_TEMP/demo-studio-release" --json > "$RUNNER_TEMP/demo-studio-pack.json"
          archive_name="$(node -e 'const packed = require(process.argv[1]); if (packed.length !== 1 || !packed[0].filename) process.exit(1); process.stdout.write(packed[0].filename)' "$RUNNER_TEMP/demo-studio-pack.json")"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          archive_path="$RUNNER_TEMP/demo-studio-release/$archive_name"
          node scripts/check-public-boundary.mjs --archive "$archive_path"
          npm install --prefix "$RUNNER_TEMP/demo-studio-production" --omit=dev "$archive_path"
          "$RUNNER_TEMP/demo-studio-production/node_modules/.bin/demo-studio" doctor

      - name: Verify the production archive with Yarn Plug'n'Play
        run: node tests/yarn-pnp-smoke.mjs "$RUNNER_TEMP/demo-studio-release/${{ steps.pack.outputs.archive_name }}"

      - name: Smoke test the installed runtime with the synthetic fixture
        id: smoke
        env:
          DEMO_STUDIO_MCP_ENTRY: ${{ runner.temp }}/demo-studio-production/node_modules/@jbjmllc/demo-studio/dist/mcp.js
          DEMO_STUDIO_SMOKE_KEEP_REVIEW: '1'
        run: npm run test:smoke

      - name: Retain the exact synthetic review candidate
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-candidate-node-${{ matrix.node-version }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ steps.smoke.outputs.mission_directory }}/render/demo.mp4
            ${{ steps.smoke.outputs.mission_directory }}/render/poster.png
            ${{ steps.smoke.outputs.mission_directory }}/render/frame-*.png
            ${{ steps.smoke.outputs.mission_directory }}/render/timeline.json
            ${{ steps.smoke.outputs.mission_directory }}/render/first-frame-integrity.json
            ${{ steps.smoke.outputs.mission_directory }}/capture.json
            ${{ steps.smoke.outputs.mission_directory }}/capture/recording.mp4
            ${{ steps.smoke.outputs.mission_directory }}/capture/*-before.png
            ${{ steps.smoke.outputs.mission_directory }}/capture/*-after.png
            ${{ steps.smoke.outputs.mission_directory }}/plan.json
            ${{ steps.smoke.outputs.mission_directory }}/mission.json
            ${{ steps.smoke.outputs.mission_directory }}/narration.json
            ${{ steps.smoke.outputs.mission_directory }}/render.json
            ${{ steps.smoke.outputs.mission_directory }}/audit.json
            ${{ steps.smoke.outputs.mission_directory }}/review-packet.json
            ${{ steps.smoke.outputs.mission_directory }}/review-history.json

      - name: Retain the validated production archive
        uses: actions/upload-artifact@v7
        with:
          name: production-archive-node-${{ matrix.node-version }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/demo-studio-release/${{ steps.pack.outputs.archive_name }}

      - name: Validate skills
        run: node scripts/check-skills.mjs

      - name: Scan public boundary
        run: node scripts/check-public-boundary.mjs
