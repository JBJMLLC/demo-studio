name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install the production release archive
        run: |
          mkdir -p ../release-bundle ../production-install
          npm pack --pack-destination ../release-bundle
          node scripts/check-public-boundary.mjs --archive ../release-bundle/jbjmllc-demo-studio-0.1.0.tgz
          npm install --prefix ../production-install --omit=dev ../release-bundle/jbjmllc-demo-studio-0.1.0.tgz
          ../production-install/node_modules/.bin/demo-studio doctor

      - name: Smoke test the installed runtime with the synthetic fixture
        id: smoke
        env:
          DEMO_STUDIO_MCP_ENTRY: ../production-install/node_modules/@jbjmllc/demo-studio/dist/mcp.js
          DEMO_STUDIO_SMOKE_KEEP_REVIEW: '1'
        run: npm run test:smoke

      - name: Retain the exact synthetic review candidate
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-candidate-node-${{ matrix.node-version }}
          retention-days: 7
          path: |
            ${{ steps.smoke.outputs.mission_directory }}/render/demo.mp4
            ${{ steps.smoke.outputs.mission_directory }}/render/poster.png
            ${{ steps.smoke.outputs.mission_directory }}/render/frame-*.png
            ${{ steps.smoke.outputs.mission_directory }}/render/timeline.json
            ${{ steps.smoke.outputs.mission_directory }}/render/first-frame-integrity.json
            ${{ steps.smoke.outputs.mission_directory }}/capture.json
            ${{ steps.smoke.outputs.mission_directory }}/capture/recording.mp4
            ${{ steps.smoke.outputs.mission_directory }}/capture/*-before.png
            ${{ steps.smoke.outputs.mission_directory }}/capture/*-after.png
            ${{ steps.smoke.outputs.mission_directory }}/plan.json
            ${{ steps.smoke.outputs.mission_directory }}/mission.json
            ${{ steps.smoke.outputs.mission_directory }}/narration.json
            ${{ steps.smoke.outputs.mission_directory }}/render.json
            ${{ steps.smoke.outputs.mission_directory }}/audit.json
            ${{ steps.smoke.outputs.mission_directory }}/review-packet.json
            ${{ steps.smoke.outputs.mission_directory }}/review-history.json

      - name: Retain the validated production archive
        uses: actions/upload-artifact@v4
        with:
          name: production-archive-node-${{ matrix.node-version }}
          retention-days: 7
          path: ../release-bundle/jbjmllc-demo-studio-0.1.0.tgz

      - name: Validate skills
        run: node scripts/check-skills.mjs

      - name: Scan public boundary
        run: node scripts/check-public-boundary.mjs
